name: Rename to index.html

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename portfolio file to index.html
        run: |
          git config user.name "nassarawan234"
          git config user.email "nassarawan234@users.noreply.github.com"
          git mv nassar-portfolio.html index.html
          git commit -m "Rename nassar-portfolio.html to index.html"
          git push
