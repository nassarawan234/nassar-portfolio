name: Update portfolio index
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch upgraded portfolio HTML
        run: |
          set -eux
          DOWNLOAD_URL="https://muse.ai/files/1327713840433448/1676289207354204/8vek62c8c56ksr3gggblr6lh/nassar-portfolio.html"
          curl -sL --fail "$DOWNLOAD_URL" -o index.html
          wc -c index.html
          SIZE=$(wc -c < index.html)
          if [ "$SIZE" -lt 2000000 ]; then echo "ERROR: index.html too small: $SIZE bytes"; exit 1; fi
          grep -q "</html>" index.html || { echo "ERROR: downloaded file is not complete HTML"; exit 1; }
          grep -q "Selected Work" index.html || { echo "ERROR: missing Selected Work section"; exit 1; }
          grep -q "FAQ" index.html || { echo "ERROR: missing FAQ section"; exit 1; }
          grep -q "CapCut" index.html || { echo "ERROR: missing CapCut"; exit 1; }
          grep -q "Addmotor" index.html || { echo "ERROR: missing Addmotor"; exit 1; }
          echo "Verified upgraded portfolio: $SIZE bytes"
      - name: Commit and push
        run: |
          set -eux
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Replace index.html with professionally upgraded portfolio" || echo "nothing to commit"
          git push
