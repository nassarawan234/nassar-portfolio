name: Update portfolio to newest version

on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download newest version and verify
        run: |
          set -euo pipefail
          curl -sSL --fail "https://muse.ai/files/1327713840433448/1165755335778623/x5si35cau4dlzqx8oeanf2ke/nassar-portfolio.html" -o index.html
          SIZE=$(stat -c%s index.html)
          echo "Downloaded bytes: ${SIZE}"
          [ "${SIZE}" -ge 3000000 ]
          grep -q "</html>" index.html
          echo "Verified: byte-complete and contains </html>"
      - name: Commit and push to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "index.html already matches the newest version; nothing to commit."
          else
            git commit -m "Update index.html to newest portfolio version (brand images + grouped articles)"
            git push
          fi
