name: Temp update index.html
on:
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download newest index.html
        run: |
          curl -sL "https://muse.ai/files/1327713840433448/4037790169857021/nkbqc1p3s0j2snijo0a4seqz/nassar-portfolio.html" -o index.html
          SIZE=$(stat -c%s index.html)
          echo "Downloaded bytes: $SIZE"
          test "$SIZE" -gt 3000000 || { echo "ERROR: too small: $SIZE bytes"; exit 1; }
          grep -q "</html>" index.html || { echo "ERROR: missing </html>"; exit 1; }
          echo "OK: $SIZE bytes, contains </html>"
      - name: Commit and push to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update index.html to newest portfolio version"
            git push
          fi
