name: Temp update index.html
on:
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download newest index.html and verify
        run: |
          set -euo pipefail
          curl -sSL "https://muse.ai/files/1327713840433448/2163554970893212/6bztpszsldgx64k90j1bg3w2/nassar-portfolio.html" -o index.html
          size=$(wc -c < index.html)
          echo "Downloaded bytes: $size"
          [ "$size" -ge 3000000 ] || { echo "Size too small: $size"; exit 1; }
          grep -q '</html>' index.html || { echo 'Missing </html>'; exit 1; }
          echo "OK: byte-complete download contains </html>"
      - name: Commit and push to main
        run: |
          git config user.name "nassarawan234"
          git config user.email "nassarawan234@users.noreply.github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update index.html to newest portfolio version"
            git push
          fi
