name: finalize-icon-update
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Place staged files
        run: |
          set -eux
          mkdir -p assets
          mv -f nassar-portfolio.html index.html
          mv -f icon-512.png apple-touch-icon.png manifest.json assets/
          ls -la
          ls -la assets
          wc -c index.html assets/*
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Replace index.html with updated portfolio; add assets/ icon files" || echo "nothing to commit"
          git push
